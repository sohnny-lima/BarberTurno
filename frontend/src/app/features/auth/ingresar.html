<app-composicion-acceso>
  <app-cabecera-pagina
    titulo="Iniciar sesión"
    subtitulo="Acceda a sus citas de la barbería."
    [ocultarEnMovil]="false"
  />
  <app-seccion-formulario>
    <form
      class="formulario"
      [formGroup]="formulario"
      (ngSubmit)="enviar()"
      [attr.aria-busy]="cargando()"
    >
      <mat-form-field appearance="outline">
        <mat-label>Correo</mat-label>
        <input matInput formControlName="correo" type="email" autocomplete="username" />
        <mat-error>{{ errorCampo(formulario.controls.correo) }}</mat-error> </mat-form-field
      ><mat-form-field appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input
          matInput
          formControlName="password"
          type="password"
          autocomplete="current-password"
        />
        <mat-error>{{ errorCampo(formulario.controls.password) }}</mat-error>
      </mat-form-field>
      @if (mensaje()) {
        <app-estado-contenido tipo="error" [texto]="mensaje()" />
      }
      <div class="acciones-formulario">
        <button mat-flat-button type="submit" [disabled]="cargando()">
          {{ cargando() ? 'Ingresando…' : 'Ingresar' }}</button
        ><a mat-button routerLink="/registro" [queryParams]="{ returnUrl }">Crear cuenta</a>
      </div>
    </form>
  </app-seccion-formulario>
</app-composicion-acceso>
