<section class="pagina-identidad">
  <h1>Iniciar sesión</h1>
  <p>Acceda a sus citas de la barbería.</p>
  <form
    class="tarjeta formulario"
    [formGroup]="formulario"
    (ngSubmit)="enviar()"
    [attr.aria-busy]="cargando()"
  >
    <mat-form-field appearance="outline">
      <mat-label>Correo</mat-label>
      <input matInput formControlName="correo" type="email" autocomplete="username" />
      <mat-error>{{ errorCampo(formulario.controls.correo) }}</mat-error> </mat-form-field
    ><mat-form-field appearance="outline">
      <mat-label>Contraseña</mat-label>
      <input matInput formControlName="password" type="password" autocomplete="current-password" />
      <mat-error>{{ errorCampo(formulario.controls.password) }}</mat-error>
    </mat-form-field>
    @if (mensaje()) {
      <p class="mensaje" role="alert">{{ mensaje() }}</p>
    }
    <div class="acciones">
      <button mat-flat-button type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Ingresando…' : 'Ingresar' }}</button
      ><a mat-button routerLink="/registro">Crear cuenta</a>
    </div>
  </form>
</section>
