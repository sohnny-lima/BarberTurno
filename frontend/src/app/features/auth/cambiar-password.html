<section class="pagina-cuenta">
  <app-cabecera-pagina
    titulo="Cambiar contraseña"
    [ocultarEnMovil]="!sesion.debeCambiarPassword()"
  />
  @if (sesion.debeCambiarPassword()) {
    <app-estado-contenido
      tipo="aviso"
      texto="Su contraseña es temporal. Cámbiela para continuar."
    />
  }
  <app-seccion-formulario>
    <form
      class="formulario"
      [formGroup]="formulario"
      (ngSubmit)="enviar()"
      [attr.aria-busy]="cargando()"
    >
      <mat-form-field appearance="outline">
        <mat-label>Contraseña actual</mat-label>
        <input
          matInput
          formControlName="passwordActual"
          type="password"
          autocomplete="current-password"
        />
        <mat-error>{{ errorCampo(formulario.controls.passwordActual) }}</mat-error> </mat-form-field
      ><mat-form-field appearance="outline">
        <mat-label>Contraseña nueva</mat-label>
        <input
          matInput
          formControlName="passwordNueva"
          aria-describedby="ayuda-password"
          type="password"
          autocomplete="new-password"
        />
        <mat-error>{{ errorCampo(formulario.controls.passwordNueva) }}</mat-error>
      </mat-form-field>
      <p class="ayuda" id="ayuda-password">
        De 8 a 72 caracteres, máximo 72 bytes, con letra y dígito.
      </p>
      @if (mensaje()) {
        <app-estado-contenido tipo="error" [texto]="mensaje()" />
      }
      <div class="acciones-formulario">
        <button mat-flat-button type="submit" [disabled]="cargando()">
          {{ cargando() ? 'Guardando…' : 'Guardar contraseña' }}
        </button>
      </div>
    </form>
  </app-seccion-formulario>
</section>
