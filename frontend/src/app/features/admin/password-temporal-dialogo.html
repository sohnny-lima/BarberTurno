<h2 mat-dialog-title>Contraseña temporal</h2>
<mat-dialog-content>
  <p>
    Se muestra una sola vez. Comuníquela en persona al titular de la cuenta. Deberá cambiarla al
    ingresar.
  </p>
  <p class="password">{{ password }}</p>
  <button mat-button (click)="copiar()">Copiar</button>
  @if (mensaje()) {
    <p role="status">{{ mensaje() }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
