<section class="pagina-identidad">
  <h1>Mi cuenta</h1>
  <p>Actualice su nombre y teléfono.</p>
  @if (!disponible() && !cargando()) {
    <button mat-button (click)="cargar()">Volver a cargar</button>
  }
  <form
    class="tarjeta formulario"
    [formGroup]="formulario"
    (ngSubmit)="enviar()"
    [attr.aria-busy]="cargando()"
  >
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" type="text" autocomplete="name" />
      <mat-error>{{ errorCampo(formulario.controls.nombre) }}</mat-error> </mat-form-field
    ><mat-form-field appearance="outline">
      <mat-label>Teléfono</mat-label>
      <input matInput formControlName="telefono" type="tel" autocomplete="tel" />
      <mat-error>{{ errorCampo(formulario.controls.telefono) }}</mat-error> </mat-form-field
    ><mat-form-field appearance="outline"
      ><mat-label>Correo (solo lectura)</mat-label
      ><input matInput formControlName="correo" type="email" readonly
    /></mat-form-field>
    @if (mensaje()) {
      <p class="mensaje" role="status">{{ mensaje() }}</p>
    }
    <div class="acciones">
      <button mat-flat-button type="submit" [disabled]="cargando() || !disponible()">
        {{ cargando() ? 'Cargando…' : 'Guardar perfil' }}</button
      ><a mat-button routerLink="/cambiar-password">Cambiar contraseña</a>
    </div>
  </form>
</section>
