<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reservar, error al consultar horas, móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#145C43}a:hover{color:#0F4D37}
.bt{font-family:'Figtree',system-ui,sans-serif;color:#17221E;background:#F6F8F7;font-size:16px;line-height:1.5;position:relative}
.bt *{box-sizing:border-box}
.bt :focus-visible{outline:3px solid #145C43;outline-offset:2px}
.bt h1,.bt h2,.bt h3,.bt p{margin:0}
.muted{color:#5B6B65}
.barra{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 4px;background:#fff;border-bottom:1px solid #E1E7E4}
.barra h1{flex:1;font-size:20px;line-height:28px;font-weight:700}
.icono{width:44px;height:44px;flex:0 0 44px;border-radius:12px;border:0;background:transparent;color:#17221E;display:inline-grid;place-items:center;cursor:pointer;position:relative}
.insignia{position:absolute;top:3px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#145C43;color:#fff;font:700 11px/18px Figtree,sans-serif;box-shadow:0 0 0 2px #fff}
.cuenta{width:44px;height:44px;flex:0 0 44px;border-radius:999px;border:0;background:#E3F1EA;color:#145C43;font:700 14px Figtree,sans-serif;cursor:pointer}
.tarjeta{background:#fff;border:1px solid #E1E7E4;border-radius:16px}
.btn{min-height:48px;border-radius:12px;font:600 16px/1.2 Figtree,sans-serif;padding:0 20px;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-primario{background:#145C43;color:#fff}
.btn-secundario{background:#fff;color:#145C43;border-color:#C9D6D0}
.btn[disabled]{background:#E7ECEA;color:#5B6B65;border-color:#E7ECEA;cursor:not-allowed}
.btn-texto{background:transparent;color:#145C43;min-height:44px;padding:0 8px;font-size:15px}
.pasos-m{display:flex;list-style:none;margin:0;padding:0;gap:4px}
.pasos-m li{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font:600 12.5px/1.2 Figtree,sans-serif;color:#5B6B65;text-align:center}
.pasos-m li span{width:30px;height:30px;border-radius:999px;display:grid;place-items:center;border:1.5px solid #C9D6D0;background:#fff;font:700 14px Figtree,sans-serif}
.pasos-m li.hecho span{background:#E3F1EA;border-color:#E3F1EA;color:#145C43}
.pasos-m li.actual{color:#145C43}
.pasos-m li.actual span{background:#145C43;border-color:#145C43;color:#fff}
.dia{flex:0 0 58px;height:72px;border-radius:14px;border:1px solid #C9D6D0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-family:Figtree,sans-serif;color:#17221E}
.dia small{font:500 13px Figtree,sans-serif;color:#5B6B65}
.dia strong{font:700 20px/1 Figtree,sans-serif}
.dia[aria-pressed="true"]{background:#145C43;border-color:#145C43;color:#fff}
.dia[aria-pressed="true"] small{color:#D7EBE1}
.alerta{display:flex;gap:12px;padding:16px;border-radius:16px;background:#FBE6E4;color:#7A1F17}
</style>
</helmet>
<div class="bt" style="width: 360px; height: 760px; display: flex; flex-direction: column">
  <header class="barra">
    <button class="icono" type="button" aria-label="Volver a servicio y profesional">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
    <h1>Reservar un turno</h1>
    <button class="icono" type="button" aria-label="Avisos: 3 sin leer" aria-haspopup="dialog">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
      <span class="insignia" aria-hidden="true">3</span>
    </button>
    <button class="cuenta" type="button" aria-label="Cuenta de Rosa Quispe: Mi cuenta y Salir" aria-haspopup="menu">RQ</button>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 20px 16px 24px">
    <ol class="pasos-m" aria-label="Pasos de la reserva">
      <li class="hecho"><span aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>Servicio</li>
      <li class="actual" aria-current="step"><span>2</span>Fecha y hora</li>
      <li><span>3</span>Confirmar</li>
    </ol>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 tabindex="-1" style="font-size: 18px; font-weight: 700">Elija el día</h2>
      <div role="group" aria-label="Días disponibles" style="display: flex; gap: 8px; overflow-x: auto; margin-right: -16px; padding-right: 16px">
        <button class="dia" type="button" aria-pressed="false" aria-label="lunes, 28 de setiembre de 2026 (hoy)"><small>hoy</small><strong>28</strong></button>
        <button class="dia" type="button" aria-pressed="true" aria-label="martes, 29 de setiembre de 2026"><small>mar</small><strong>29</strong></button>
        <button class="dia" type="button" aria-pressed="false" aria-label="miércoles, 30 de setiembre de 2026"><small>mié</small><strong>30</strong></button>
        <button class="dia" type="button" aria-pressed="false" aria-label="jueves, 1 de octubre de 2026"><small>jue</small><strong>1</strong></button>
        <button class="dia" type="button" aria-pressed="false" aria-label="viernes, 2 de octubre de 2026"><small>vie</small><strong>2</strong></button>
        <button class="dia" type="button" aria-pressed="false" aria-label="sábado, 3 de octubre de 2026"><small>sáb</small><strong>3</strong></button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 14px">
      <h2 style="font-size: 18px; font-weight: 700">martes, 29 de setiembre</h2>
      <div class="alerta" role="alert">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 24px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <p style="font-weight: 700">No se pudieron consultar las horas libres.</p>
          <p style="font-size: 15px">Revise su conexión y vuelva a intentarlo. Su servicio y profesional se conservan.</p>
        </div>
      </div>
      <button class="btn btn-secundario" type="button" style="align-self: flex-start">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 5v6h-6"></path></svg>
        Reintentar
      </button>
    </section>
  </main>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 16px; background: #FFFFFF; border-top: 1px solid #E1E7E4">
    <p class="muted" style="font-size: 14px">Elija una hora para continuar.</p>
    <button class="btn btn-primario" type="button" disabled="" style="width: 100%">Siguiente</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
