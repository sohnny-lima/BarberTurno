<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú de cuenta con Salir, móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#145C43}a:hover{color:#0F4D37}
.bt{font-family:'Figtree',system-ui,sans-serif;color:#17221E;background:#F6F8F7;font-size:16px;line-height:1.5;position:relative;overflow:hidden}
.bt *{box-sizing:border-box}
.bt :focus-visible{outline:3px solid #145C43;outline-offset:2px}
.bt h1,.bt h2,.bt h3,.bt p{margin:0}
.muted{color:#5B6B65}
.barra{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 16px;background:#fff;border-bottom:1px solid #E1E7E4}
.barra h1{flex:1;font-size:20px;line-height:28px;font-weight:700}
.icono{width:44px;height:44px;flex:0 0 44px;border-radius:12px;border:0;background:transparent;color:#17221E;display:inline-grid;place-items:center;cursor:pointer;position:relative}
.insignia{position:absolute;top:3px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#145C43;color:#fff;font:700 11px/18px Figtree,sans-serif;box-shadow:0 0 0 2px #fff}
.cuenta{width:44px;height:44px;flex:0 0 44px;border-radius:999px;border:0;background:#E3F1EA;color:#145C43;font:700 14px Figtree,sans-serif;cursor:pointer}
.cuenta[aria-expanded="true"]{box-shadow:0 0 0 3px #145C43}
.menu{position:absolute;top:64px;right:10px;width:248px;background:#fff;border:0;border-radius:16px;box-shadow:0 14px 36px rgba(14,40,31,0.18);padding:6px;display:flex;flex-direction:column}
.menu [role="menuitem"]{min-height:48px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:10px;border:0;background:transparent;font:600 16px Figtree,sans-serif;color:#17221E;text-decoration:none;cursor:pointer;text-align:left;width:100%}
.menu [role="menuitem"].salir{color:#9A261D}
.pestanas{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:#fff;border-top:1px solid #E1E7E4;padding:6px 8px 10px}
.pestanas a{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px;font:600 12.5px Figtree,sans-serif;color:#5B6B65;text-decoration:none}
.pestanas a[aria-current="page"]{color:#145C43}
.pestanas a[aria-current="page"] svg{background:#E3F1EA;border-radius:999px;padding:3px 14px;box-sizing:content-box}
</style>
</helmet>
<div class="bt" style="width: 360px; height: 780px; display: flex; flex-direction: column">
  <header class="barra">
    <h1>Reservar un turno</h1>
    <button class="icono" type="button" aria-label="Avisos: 3 sin leer" aria-haspopup="dialog">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
      <span class="insignia" aria-hidden="true">3</span>
    </button>
    <button class="cuenta" type="button" aria-label="Cuenta de Rosa Quispe: Mi cuenta y Salir" aria-haspopup="menu" aria-expanded="true" aria-controls="menu-cuenta">RQ</button>
  </header>

  <main aria-hidden="true" style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="height: 148px; border-radius: 16px; background: #145C43"></div>
    <div style="height: 60px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E1E7E4"></div>
    <div style="height: 146px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E1E7E4"></div>
    <div style="height: 218px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E1E7E4"></div>
  </main>

  <div id="menu-cuenta" class="menu" role="menu" aria-label="Cuenta">
    <div style="padding: 10px 12px 12px; border-bottom: 1px solid #EEF2F0; margin-bottom: 4px">
      <p style="font-weight: 700">Rosa Quispe</p>
      <p class="muted" style="font-size: 14px">Cliente</p>
    </div>
    <a href="#" role="menuitem">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
      Mi cuenta
    </a>
    <button type="button" role="menuitem" class="salir">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H5v16h5"></path><path d="M14 8l4 4-4 4M18 12H9"></path></svg>
      Salir
    </button>
  </div>

  <nav class="pestanas" aria-label="Navegación principal">
    <a href="#" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4M12 13v4M10 15h4"></path></svg>Reservar</a>
    <a href="#"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 9h6M9 13h6M9 17h3"></path></svg>Mis citas</a>
    <a href="#"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Mi cuenta</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
