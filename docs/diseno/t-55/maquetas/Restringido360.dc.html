<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Contraseña temporal, acceso restringido, móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#145C43}a:hover{color:#0F4D37}
.bt{font-family:'Figtree',system-ui,sans-serif;color:#17221E;background:#F6F8F7;font-size:16px;line-height:1.5;position:relative}
.bt *{box-sizing:border-box}
.bt :focus-visible{outline:3px solid #145C43;outline-offset:2px}
.bt h1,.bt h2,.bt h3,.bt p{margin:0}
.muted{color:#5B6B65}
.barra{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;background:#fff;border-bottom:1px solid #E1E7E4}
.marca{flex:1;display:flex;align-items:center;gap:10px;font:800 18px Figtree,sans-serif}
.marca span{width:32px;height:32px;border-radius:9px;background:#145C43;color:#fff;display:grid;place-items:center}
.tarjeta{background:#fff;border:1px solid #E1E7E4;border-radius:16px}
.btn{min-height:48px;border-radius:12px;font:600 16px/1.2 Figtree,sans-serif;padding:0 20px;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-primario{background:#145C43;color:#fff}
.btn-secundario{background:#fff;color:#145C43;border-color:#C9D6D0}
.campo{display:flex;flex-direction:column;gap:6px;font:600 14px Figtree,sans-serif;color:#3F4B46}
.campo input{min-height:48px;border:1px solid #C9D6D0;border-radius:12px;background:#fff;padding:0 14px;font:500 16px Figtree,sans-serif;color:#17221E;width:100%}
.ayuda{font:500 13px Figtree,sans-serif;color:#5B6B65}
.aviso{display:flex;gap:10px;padding:14px;border-radius:14px;background:#FCEFD4;color:#5C3A00}
</style>
</helmet>
<div class="bt" style="width: 360px; height: 760px; display: flex; flex-direction: column">
  <header class="barra">
    <div class="marca"><span aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="3"></circle><circle cx="6" cy="17" r="3"></circle><path d="M8.5 8.5L20 18M8.5 15.5L20 6"></path></svg></span>BarberTurno</div>
    <button class="btn btn-secundario" type="button" style="min-height: 44px; padding: 0 14px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H5v16h5"></path><path d="M14 8l4 4-4 4M18 12H9"></path></svg>
      Salir
    </button>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 24px 16px">
    <h1 style="font-size: 24px; font-weight: 700; line-height: 32px">Cambiar contraseña</h1>
    <div class="aviso" role="status">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 22px"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
      <p style="font-size: 15px; font-weight: 600">Su contraseña es temporal. Cámbiela para continuar.</p>
    </div>
    <form class="tarjeta" style="padding: 18px; display: flex; flex-direction: column; gap: 16px">
      <label class="campo">Contraseña actual<input type="password" autocomplete="current-password"></label>
      <label class="campo">Contraseña nueva<input type="password" autocomplete="new-password" aria-describedby="regla"></label>
      <p id="regla" class="ayuda" style="margin-top: -8px">De 8 a 72 caracteres, con al menos una letra y un número.</p>
      <button class="btn btn-primario" type="submit">Cambiar contraseña</button>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
