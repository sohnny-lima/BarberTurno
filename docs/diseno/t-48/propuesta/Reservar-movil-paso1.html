<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reservar, paso 1, móvil</title>

</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&amp;family=Big+Shoulders+Display:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D5C6C}a:hover{color:#15232B}
.bt{font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;color:#15232B;font-variant-numeric:tabular-nums}
.disp{font-family:'Big Shoulders Display',Impact,sans-serif}
.btn{font:inherit;font-weight:600;font-size:16px;min-height:48px;padding:0 20px;border-radius:10px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-p{background:#7A2333;color:#fff}
.ico{width:44px;height:44px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;position:relative}
.serv{font:inherit;text-align:left;width:100%;background:#fff;border:1.5px solid #C3CCCD;border-radius:14px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;color:#15232B;cursor:pointer}
.serv b{font-size:17px}
.serv p{margin:0;font-size:14px;color:#4A5A60;line-height:1.45;grid-column:1}
.precio{grid-column:2;grid-row:1 / span 2;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.precio strong{font-size:20px}
.precio span{font-size:13px;color:#4A5A60}
.serv-sel{border:2px solid #7A2333;background:#FBF4F5}
.prof{font:inherit;background:#fff;border:1.5px solid #C3CCCD;border-radius:12px;min-height:64px;padding:10px;display:flex;align-items:center;gap:10px;text-align:left;color:#15232B;cursor:pointer}
.av{width:36px;height:36px;border-radius:50%;background:#E4E8E7;display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.prof-sel{border:2px solid #7A2333;background:#FBF4F5}
</style>

<div class="bt" style="width:360px;height:1080px;box-sizing:border-box;background:#F1F3F1;display:flex;flex-direction:column;position:relative">
  <header style="height:56px;background:#15232B;display:flex;align-items:center;gap:4px;padding:0 6px;flex-shrink:0">
    <button class="ico" type="button" aria-label="Abrir menú"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="#fff" stroke-width="2" stroke-linecap="round"></path></svg></button>
    <span class="disp" style="color:#fff;font-size:22px;font-weight:800;letter-spacing:.02em;flex:1">BARBERTURNO</span>
    <button class="ico" type="button" aria-label="Avisos: 1 sin leer"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z M10 20a2 2 0 0 0 4 0" stroke="#fff" stroke-width="2" fill="none" stroke-linejoin="round"></path></svg><span style="position:absolute;top:6px;right:6px;background:#E2B65C;color:#15232B;font-size:11px;font-weight:700;border-radius:999px;padding:0 5px">1</span></button>
  </header>
  <main style="padding:20px 16px 120px;display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <h1 class="disp" style="margin:0;font-size:40px;font-weight:800;line-height:1">Reservar un turno</h1>
      <div style="display:flex;gap:6px" aria-hidden="true">
        <span style="flex:1;height:4px;border-radius:2px;background:#7A2333"></span>
        <span style="flex:1;height:4px;border-radius:2px;background:#C3CCCD"></span>
        <span style="flex:1;height:4px;border-radius:2px;background:#C3CCCD"></span>
      </div>
      <p style="margin:0;font-size:15px"><b>Paso 1 de 3:</b> servicio y profesional</p>
    </div>
    <section aria-labelledby="m-serv" style="display:flex;flex-direction:column;gap:10px">
      <h2 id="m-serv" style="margin:0;font-size:18px">Servicio</h2>
      <button class="serv" type="button" aria-pressed="false"><b>Corte clásico</b><p>Corte con máquina y tijera, lavado y peinado.</p><span class="precio"><strong>S/ 25</strong><span>30 min</span></span></button>
      <button class="serv serv-sel" type="button" aria-pressed="true"><b>Corte + barba</b><p>Corte completo y perfilado de barba con toalla caliente.</p><span class="precio"><strong>S/ 40</strong><span>50 min</span></span></button>
      <button class="serv" type="button" aria-pressed="false"><b>Perfilado de barba</b><p>Definición de contornos y navaja.</p><span class="precio"><strong>S/ 15</strong><span>20 min</span></span></button>
      <p style="margin:0;font-size:14px;color:#4A5A60">Pago presencial en la barbería.</p>
    </section>
    <section aria-labelledby="m-prof" style="display:flex;flex-direction:column;gap:10px">
      <h2 id="m-prof" style="margin:0;font-size:18px">Profesional</h2>
      <div role="radiogroup" aria-labelledby="m-prof" style="display:grid;grid-template-columns:minmax(0,1fr);gap:8px">
        <button class="prof prof-sel" type="button" role="radio" aria-checked="true"><span class="av" style="background:#15232B;color:#E2B65C" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="9" cy="9" r="4" stroke="#E2B65C" stroke-width="2" fill="none"></circle><circle cx="16" cy="15" r="4" stroke="#E2B65C" stroke-width="2" fill="none"></circle></svg></span><span><b>Sin preferencia</b><br><span style="font-size:13px;color:#4A5A60">Le mostramos todas las horas</span></span></button>
        <button class="prof" type="button" role="radio" aria-checked="false"><span class="av" aria-hidden="true">CH</span><span><b>Carlos Huamán</b><br><span style="font-size:13px;color:#4A5A60">Cortes clásicos</span></span></button>
        <button class="prof" type="button" role="radio" aria-checked="false"><span class="av" aria-hidden="true">MQ</span><span><b>Miguel Quispe</b><br><span style="font-size:13px;color:#4A5A60">Barba y degradados</span></span></button>
      </div>
    </section>
  </main>
  <div style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #D5DCDC;padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px">
    <span style="font-size:14px;color:#4A5A60">Corte + barba, sin preferencia</span>
    <button class="btn btn-p" type="button" style="width:100%">Elegir fecha y hora</button>
  </div>
</div>


</body>
</html>
