<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BarberTurno — Prototipo APF2</title>
<style>
:root{--ink:#172a39;--navy:#173c4d;--teal:#087f8c;--pale:#edf5f6}*{box-sizing:border-box}body{margin:0;background:#f5f8fa;color:var(--ink);font:16px system-ui,sans-serif}header{background:var(--navy);color:white;padding:18px 4%;display:flex;align-items:center;gap:20px;flex-wrap:wrap}header b{font-size:26px;margin-right:auto}header button{background:transparent;border:1px solid #81979f;color:white}.demo{padding:9px 4%;background:#fff2ce;font-size:13px}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);max-width:1450px;margin:auto}nav{padding:24px 14px;background:#e7f0f3;min-height:90vh}nav button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);margin-bottom:8px}nav button.active{background:var(--teal);color:white}main{padding:28px 36px;min-width:0}h1{font-size:30px;margin:0 0 8px}h2{font-size:21px}p{line-height:1.55}.muted{color:#59717b}button{border:0;border-radius:7px;padding:12px 18px;background:var(--teal);color:white;font:inherit;cursor:pointer}button.secondary{background:#e8f0f3;color:var(--ink)}button.danger{background:#9c3e3b}button:disabled{opacity:.42;cursor:default}button:hover:not(:disabled){filter:brightness(.93)}input,select{font:inherit;padding:11px;border:1px solid #bacdd3;border-radius:6px;width:100%;background:white;color:var(--ink)}label{display:block;font-size:14px;font-weight:600;margin-bottom:16px}label input,label select{margin-top:7px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{background:white;border:1px solid #d8e3e6;border-radius:10px;padding:22px;margin:20px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}.stat{background:var(--pale);padding:17px;border-radius:8px}.stat b{display:block;font-size:28px}.tag{font-size:13px;background:#edf5f6;border-radius:20px;padding:5px 10px;display:inline-block}.rows{display:grid;gap:12px}.row{padding:16px;border:1px solid #d8e3e6;border-radius:8px;background:white}.row p{margin:5px 0}.small{font-size:13px}#notice{display:none;padding:14px;background:#d9f0e8;border:1px solid #9ecdbc;border-radius:8px;margin:15px 0}dialog{border:0;border-radius:12px;padding:25px;width:min(590px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 100px #0003}dialog::backdrop{background:#11273388}.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:10px}.error{background:#fde8e5;color:#8d2521;padding:12px;border-radius:6px}.steps{font-size:14px;color:var(--teal);font-weight:600}.slots{display:flex;flex-wrap:wrap;gap:9px}.slots label{margin:0}.slots input{width:auto;margin:0}.slot{padding:10px 12px;background:var(--pale);border-radius:7px}footer{font-size:12px;color:#59717b;margin:25px 0}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:12px;text-align:left;border-bottom:1px solid #d8e3e6}.overflow{overflow-x:auto}@media(max-width:700px){header{padding:14px 18px}header b{width:100%}.layout{display:block}nav{min-height:0;display:flex;overflow:auto;padding:12px;gap:5px}nav button{width:auto;white-space:nowrap;margin:0;padding:10px}main{padding:20px 16px}.grid{grid-template-columns:1fr}.card{padding:16px}h1{font-size:26px}.demo{padding:8px 16px}}
</style>
<header><b>BarberTurno</b><span id="identity">Bienvenido</span><button onclick="chooseRole()">Cambiar perfil demo</button><button onclick="resetDemo()">Reiniciar demo</button></header>
<div class="demo">Prototipo académico · Datos ficticios · Escenario: 28/09/2026, 09:00 (Lima). Simula interacciones; no conecta con un servidor Java.</div>
<div class="layout"><nav id="nav"></nav><main><div id="notice" role="status"></div><div id="view"></div><footer>Barbería Huamanga Style · Una sede · Confirmaciones dentro del sistema · Precios de ejemplo</footer></main></div>
<dialog id="modal"><div id="modalbody"></div></dialog>
<script>
const seed=()=>({profile:{name:'Cliente de demostración',email:'cliente@ejemplo.test',phone:'999000000'},services:[{id:1,name:'Corte clásico',desc:'Corte y acabado',duration:30,price:25,active:true},{id:2,name:'Barba',desc:'Perfilado de barba',duration:20,price:20,active:true}],barbers:[{id:1,name:'Carlos',specialty:'Corte y barba',active:true},{id:2,name:'Miguel',specialty:'Corte y barba',active:true}],hours:{1:{start:'09:00',end:'18:00',restStart:'13:00',restEnd:'14:00'},2:{start:'09:00',end:'18:00',restStart:'13:00',restEnd:'14:00'}},blocks:[],reservations:[{id:101,client:1,clientName:'Cliente de demostración',service:1,serviceName:'Corte clásico',barber:1,date:'2026-10-01',time:'10:00',duration:30,price:25,state:'confirmada'},{id:102,client:2,clientName:'Luis demo',service:2,serviceName:'Barba',barber:1,date:'2026-09-28',time:'09:30',duration:20,price:20,state:'confirmada'},{id:103,client:1,clientName:'Cliente de demostración',service:1,serviceName:'Corte clásico',barber:2,date:'2026-09-27',time:'10:00',duration:30,price:25,state:'completada'},{id:104,client:1,clientName:'Cliente de demostración',service:2,serviceName:'Barba',barber:1,date:'2026-09-28',time:'10:00',duration:20,price:20,state:'confirmada'},{id:100,client:2,clientName:'Luis demo',service:1,serviceName:'Corte clásico',barber:1,date:'2026-09-29',time:'11:00',duration:30,price:25,state:'pendiente'}],audit:[{rid:101,actor:'Cliente demo',at:'28/09/2026 08:55',action:'Crear reserva',detail:'Sin reserva → confirmada'}],notifications:[{text:'Tu reserva BT-101 está confirmada.',read:false}]});
let db;try{db=JSON.parse(localStorage.getItem('barberturno_apf2_v2'))||seed()}catch{db=seed()}
let role='cliente',logged=false,route='cuenta';const clock=new Date('2026-09-28T09:00:00-05:00');const labels={cuenta:'Mi cuenta',reserva:'Reservar',citas:'Mis citas',agenda:'Agenda',servicios:'Servicios',barberos:'Barberos',horarios:'Horarios',reportes:'Reportes'};
const $=s=>document.querySelector(s),escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem('barberturno_apf2_v2',JSON.stringify(db))}catch{}};
const nameBarber=id=>db.barbers.find(b=>b.id==id)?.name||'Profesional';const money=n=>'S/ '+Number(n).toFixed(2);const mins=t=>Number(t.split(':')[0])*60+Number(t.split(':')[1]);const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function toast(t,bad=false){$('#notice').textContent=t;$('#notice').style.display='block';$('#notice').style.background=bad?'#fde8e5':'#d9f0e8';window.scrollTo(0,0)}
function openModal(t,html){$('#modalbody').innerHTML=`<div class="dialoghead"><h2>${t}</h2><button class="secondary" onclick="closeModal()" aria-label="Cerrar">Cerrar</button></div>${html}`;$('#modal').showModal()}
function closeModal(){$('#modal').close()}
function resetDemo(){db=seed();save();render();toast('Datos de demostración restablecidos.')}
function chooseRole(){openModal('Recorrer el prototipo',`<p>Elige un perfil para simular sus permisos.</p><div class="actions"><button onclick="login('cliente')">Cliente demo</button><button onclick="login('barbero')">Barbero Carlos</button><button onclick="login('admin')">Administrador</button></div>`)}
function login(r){role=r;logged=true;if($('#modal').open)closeModal();go(r==='cliente'?'reserva':'agenda')}
function allowed(){return !logged?['cuenta']:role==='cliente'?['cuenta','reserva','citas']:role==='barbero'?['cuenta','agenda']:Object.keys(labels)}
function go(r){route=allowed().includes(r)?r:allowed()[0];$('#notice').style.display='none';render()}
function render(){if(!allowed().includes(route))route=allowed()[0];$('#identity').textContent=logged?`${role==='admin'?'Administrador':role==='barbero'?'Carlos · Barbero':db.profile.name}`:'Sin sesión';$('#nav').innerHTML=allowed().map(r=>`<button class="${route===r?'active':''}" onclick="go('${r}')">${labels[r]}</button>`).join('');({cuenta:account,reserva:reserve,citas:myBookings,agenda:agenda,servicios:()=>catalog('services'),barberos:()=>catalog('barbers'),horarios:schedule,reportes:reports})[route]()}
function account(){if(!logged){$('#view').innerHTML=`<h1>Iniciar sesión</h1><p class="muted">Accede a tus citas de la barbería.</p><form class="card" onsubmit="event.preventDefault();login('cliente')"><label>Correo<input type="email" required value="cliente@ejemplo.test"></label><label>Contraseña de demostración<input type="password" required minlength="6" value="demo123"></label><button>Ingresar como cliente</button><button type="button" class="secondary" onclick="register()">Crear cuenta</button><p class="small muted">Acceso simulado. No ingreses una contraseña real.</p></form>`;return}if(role!=='cliente'){$('#view').innerHTML=`<h1>Mi cuenta</h1><div class="card"><h2>${role==='admin'?'Administrador':'Carlos'}</h2><p>Perfil de personal · ${role}</p><button onclick="logged=false;go('cuenta')">Cerrar sesión</button></div>`;return}$('#view').innerHTML=`<h1>Mi cuenta</h1><form class="card" onsubmit="updateProfile(event)"><label>Nombre<input name="name" required value="${escape(db.profile.name)}"></label><label>Correo<input name="email" type="email" required value="${escape(db.profile.email)}"></label><label>Teléfono<input name="phone" pattern="[0-9]{9}" required value="${escape(db.profile.phone)}"></label><button>Guardar perfil</button> <button type="button" class="secondary" onclick="logged=false;go('cuenta')">Cerrar sesión</button></form>`}
function register(){openModal('Crear cuenta de cliente',`<form onsubmit="createAccount(event)"><label>Nombre<input name="name" required></label><label>Correo<input name="email" type="email" required></label><label>Teléfono<input name="phone" pattern="[0-9]{9}" required></label><label>Contraseña de ejemplo<input type="password" minlength="6" required></label><button>Registrarme</button><p class="small muted">La contraseña no se almacena en esta demostración.</p></form>`)}
function createAccount(e){e.preventDefault();db.profile=Object.fromEntries(new FormData(e.target));db.reservations=db.reservations.filter(r=>r.client!==1);db.notifications=[];save();closeModal();login('cliente');toast('Cuenta de demostración creada.')}
function updateProfile(e){e.preventDefault();db.profile=Object.fromEntries(new FormData(e.target));save();render();toast('Perfil actualizado.')}
function options(items,val){return items.filter(x=>x.active).map(x=>`<option value="${x.id}" ${x.id==val?'selected':''}>${escape(x.name)}</option>`).join('')}
function freeSlots(b,date,duration,ignore=0){const h=getHours(b,date);if(!h||!db.barbers.find(x=>x.id==b)?.active)return[];const arr=[];for(let m=mins(h.start);m+duration<=mins(h.end);m+=10){let t=fmt(m);if(new Date(`${date}T${t}:00-05:00`)<=clock)continue;if(m<mins(h.restEnd)&&m+duration>mins(h.restStart))continue;if(db.blocks.some(k=>k.barber==b&&k.date===date&&m<mins(k.end)&&m+duration>mins(k.start)))continue;if(db.reservations.some(r=>r.id!==ignore&&r.barber==b&&r.date===date&&r.state!=='cancelada'&&m<mins(r.time)+r.duration&&m+duration>mins(r.time)))continue;arr.push(t)}return arr}
function getHours(b,date){const day=new Date(date+'T12:00:00-05:00').getUTCDay();return db.weekHours?.[b]?.[day]||db.hours[b]}
function selectedService(){const svc=db.services.find(s=>s.id===booking.service),old=db.reservations.find(r=>r.id===booking.id);return old?{...svc,duration:old.duration,price:old.price}:svc}
let booking={};
function reserve(id=0){let old=db.reservations.find(r=>r.id===id);booking={id,service:old?.service||db.services.find(s=>s.active)?.id,barber:old?.barber||db.barbers.find(b=>b.active)?.id,date:old?.date||'2026-10-01'};$('#view').innerHTML=`<h1>${id?'Reprogramar cita':'Reservar un turno'}</h1><p class="steps">1 Elegir servicio y horario · 2 Revisar · 3 Confirmar</p><div class="card"><div class="grid"><label>Servicio<select id="svc" ${id?'disabled':''} onchange="loadSlots()">${id?`<option value="${old.service}">${escape(old.serviceName)}</option>`:options(db.services,booking.service)}</select></label><label>Profesional<select id="bar" onchange="loadSlots()">${options(db.barbers,booking.barber)}</select></label></div><label>Fecha<input id="date" type="date" min="2026-09-28" value="${booking.date}" onchange="loadSlots()"></label><h2>Horarios disponibles</h2><div id="slots" class="slots"></div><p id="cost"></p><button id="review" onclick="reviewBooking()">Revisar reserva</button></div>`;loadSlots()}
function loadSlots(){booking.service=Number($('#svc').value);booking.barber=Number($('#bar').value);booking.date=$('#date').value;const svc=selectedService();if(!svc||!booking.date||!booking.barber){$('#slots').innerHTML='Sin opciones activas.';$('#review').disabled=true;return}const times=freeSlots(booking.barber,booking.date,svc.duration,booking.id);$('#slots').innerHTML=times.length?times.map((t,i)=>`<label class="slot"><input type="radio" name="time" value="${t}" ${i===0?'checked':''}> ${t}</label>`).join(''):'No hay franjas disponibles. Prueba otra fecha o profesional.';$('#cost').textContent=`${svc.duration} minutos · ${money(svc.price)} · Pago presencial`;$('#review').disabled=!times.length}
function canChange(r){return role==='admin'||((role==='cliente'&&r.client===1)&&new Date(`${r.date}T${r.time}:00-05:00`)-clock>=7200000)}
function reviewBooking(){booking.time=$('input[name="time"]:checked')?.value;const svc=selectedService();openModal('Revisar reserva',`<p><b>${escape(svc.name)}</b><br>${escape(nameBarber(booking.barber))}<br>${booking.date} · ${booking.time} a ${fmt(mins(booking.time)+svc.duration)}<br>${money(svc.price)}</p><p>Podrás cambiar o cancelar hasta dos horas antes.</p>${role==='admin'&&booking.id?'<label>Motivo de cambio administrativo<input id="reason" required></label>':''}<div class="actions"><button onclick="confirmBooking()">Confirmar reserva</button><button class="secondary" onclick="simulateConflict()">Simular franja ocupada</button></div>`)}
function simulateConflict(){const svc=selectedService();if(freeSlots(booking.barber,booking.date,svc.duration,booking.id).includes(booking.time)){db.reservations.push({id:Math.max(...db.reservations.map(r=>r.id))+1,client:2,clientName:'Otro cliente demo',service:svc.id,serviceName:svc.name,barber:booking.barber,date:booking.date,time:booking.time,duration:svc.duration,price:svc.price,state:'confirmada'});save()}closeModal();loadSlots();toast('La franja dejó de estar disponible. Selecciona otra hora. No se guardó ningún cambio.',true)}
function log(r,action,detail){db.audit.push({rid:r.id,actor:role==='cliente'?db.profile.name:role==='barbero'?'Carlos':'Administrador',at:'28/09/2026 09:00',action,detail});if(r.client===1)db.notifications.unshift({text:`BT-${r.id}: ${action}. ${r.date} ${r.time}.`,read:false})}
function confirmBooking(){const old=db.reservations.find(r=>r.id===booking.id),svc=selectedService();if(old&&(!canChange(old)||old.state!=='confirmada')){closeModal();toast('Cambio no permitido por estado, propiedad o anticipación.',true);return}if(!freeSlots(booking.barber,booking.date,svc.duration,booking.id).includes(booking.time)){simulateConflict();return}let reason=role==='admin'&&old?$('#reason').value.trim():'';if(role==='admin'&&old&&!reason){$('#reason').focus();return}if(old){let prev=`${old.date} ${old.time}`;Object.assign(old,{barber:booking.barber,date:booking.date,time:booking.time,service:svc.id,serviceName:svc.name,duration:svc.duration});log(old,'Reprogramación',`${prev} → ${old.date} ${old.time}. ${reason}`)}else{let r={id:Math.max(100,...db.reservations.map(x=>x.id))+1,client:1,clientName:db.profile.name,service:svc.id,serviceName:svc.name,barber:booking.barber,date:booking.date,time:booking.time,duration:svc.duration,price:svc.price,state:'confirmada'};db.reservations.push(r);log(r,'Reserva confirmada','Sin reserva → confirmada')}save();closeModal();go('citas');toast('Reserva guardada. Revisa el detalle y la notificación.')}
function bookingRow(r,staff=false){let live=r.state==='confirmada',pending=r.state==='pendiente',mine=r.client===1;return `<article class="row"><span class="tag">${r.state}</span><h2>BT-${r.id} · ${escape(r.serviceName)}</h2><p>${r.date} · ${r.time} a ${fmt(mins(r.time)+r.duration)} · ${escape(nameBarber(r.barber))}</p><p>${escape(r.clientName)} · ${money(r.price)}</p><div class="actions">${live&&((role==='cliente'&&mine)||role==='admin')?`<button ${canChange(r)?'':'disabled'} onclick="startReschedule(${r.id})">Reprogramar</button><button class="secondary" ${canChange(r)?'':'disabled'} onclick="cancelBooking(${r.id})">Cancelar</button>`:''}${pending&&(role==='admin'||(role==='cliente'&&mine))?`<button class="secondary" ${canChange(r)?'':'disabled'} onclick="cancelBooking(${r.id})">Cancelar solicitud</button>`:''}${staff&&pending?`<button onclick="transition(${r.id},'confirmada')">Confirmar solicitud</button>`:''}${staff&&live?`<button onclick="transition(${r.id},'en atención')">Iniciar atención</button><button class="secondary" onclick="transition(${r.id},'no asistió')">No asistió</button>`:''}${staff&&r.state==='en atención'?`<button onclick="transition(${r.id},'completada')">Completar</button>`:''}${staff?`<button class="secondary" onclick="audit(${r.id})">Ver cambios</button>`:''}</div>${live&&!canChange(r)&&mine&&role==='cliente'?'<p class="small muted">Faltan menos de dos horas. Contacta al administrador para solicitar un cambio.</p>':''}</article>`}
function startReschedule(id){let r=db.reservations.find(x=>x.id===id);if(!canChange(r))return toast('Cambio no permitido.',true);route='reserva';render();reserve(id)}
function cancelBooking(id){const r=db.reservations.find(x=>x.id===id);openModal('Cancelar cita',`<p>Se liberará el horario de BT-${id}.</p><label>Motivo ${role==='admin'?'obligatorio':'opcional'}<input id="reason"></label><button class="danger" onclick="doCancel(${id})">Confirmar cancelación</button>`)}
function doCancel(id){const r=db.reservations.find(x=>x.id===id);if(!canChange(r)||!['pendiente','confirmada'].includes(r.state)){closeModal();return toast('Cancelación no permitida.',true)}const reason=$('#reason').value.trim();if(role==='admin'&&!reason){$('#reason').focus();return}let previous=r.state;r.state='cancelada';log(r,'Cancelación',`${previous} → cancelada. ${reason}`);save();closeModal();render();toast('Cita cancelada. La franja está disponible.')}
function myBookings(){const rs=db.reservations.filter(r=>r.client===1);$('#view').innerHTML=`<h1>Mis citas e historial</h1><div class="grid"><label>Desde<input type="date" id="mineFrom" value="2026-09-01" onchange="filterMine()"></label><label>Hasta<input type="date" id="mineTo" value="2026-12-31" onchange="filterMine()"></label></div><label>Estado<select id="mineState" onchange="filterMine()"><option value="">Todos</option><option>pendiente</option><option>confirmada</option><option>en atención</option><option>completada</option><option>cancelada</option><option>no asistió</option></select></label><div class="rows" id="mineRows">${rs.map(r=>bookingRow(r)).join('')||'<p>Aún no tienes reservas.</p>'}</div><section class="card"><h2>Notificaciones internas</h2>${db.notifications.map(n=>`<p>${escape(n.text)} ${n.read?'· Leída':'· Nueva'}</p>`).join('')||'<p>Sin notificaciones.</p>'}<button class="secondary" onclick="db.notifications.forEach(n=>n.read=true);save();render()">Marcar como leídas</button></section>`}
function filterMine(){let st=$('#mineState').value,from=$('#mineFrom').value,to=$('#mineTo').value;if(from>to)return toast('Rango de fechas inválido.',true);$('#mineRows').innerHTML=db.reservations.filter(r=>r.client===1&&r.date>=from&&r.date<=to&&(!st||r.state===st)).map(r=>bookingRow(r)).join('')||'<p>Sin resultados.</p>'}
function agenda(){const date=window.agendaDate||'2026-09-28';$('#view').innerHTML=`<h1>Agenda diaria y semanal</h1><label>Vista<select id="agendaMode" onchange="window.agendaMode=this.value;agendaRows()"><option value="dia" ${window.agendaMode!=='semana'?'selected':''}>Día</option><option value="semana" ${window.agendaMode==='semana'?'selected':''}>Semana (lunes a domingo)</option></select></label><div class="grid"><label>Fecha<input type="date" id="agendaDate" value="${date}" onchange="window.agendaDate=this.value;agenda()"></label><label>Profesional<select id="agendaBarber" onchange="agendaRows()">${role==='admin'?'<option value="">Todos</option>':''}${db.barbers.filter(b=>role==='admin'||b.id===1).map(b=>`<option value="${b.id}">${escape(b.name)}</option>`).join('')}</select></label></div><div class="rows" id="agendaRows"></div>`;agendaRows()}
function agendaRows(){let b=$('#agendaBarber').value,date=$('#agendaDate').value,start=date,end=date;if($('#agendaMode').value==='semana'){let d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);start=d.toISOString().slice(0,10);d.setUTCDate(d.getUTCDate()+6);end=d.toISOString().slice(0,10)}$('#agendaRows').innerHTML=`<p>Periodo: ${start} al ${end}</p>`+(db.reservations.filter(r=>r.date>=start&&r.date<=end&&(!b||r.barber==b)&&(role==='admin'||r.barber===1)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(r=>bookingRow(r,true)).join('')||'<p>Sin citas para este filtro.</p>')}
function transition(id,state){const r=db.reservations.find(x=>x.id===id);if(!['admin','barbero'].includes(role)||(role==='barbero'&&r.barber!==1))return;const ok={pendiente:['confirmada'],confirmada:['en atención','no asistió'],'en atención':['completada']};if(!(ok[r.state]||[]).includes(state))return toast('Transición no permitida.',true);let before=r.state;r.state=state;log(r,'Cambio de estado',`${before} → ${state}`);save();agenda();toast('Estado actualizado.')}
function audit(id){openModal(`Cambios de BT-${id}`,db.audit.filter(a=>a.rid===id).map(a=>`<div class="row"><b>${escape(a.action)}</b><p>${escape(a.detail)}</p><p class="small">${escape(a.actor)} · ${a.at}</p></div>`).join('')||'<p>Sin cambios posteriores en este escenario.</p>')}
function catalog(type){if(role!=='admin')return;let service=type==='services';$('#view').innerHTML=`<h1>${service?'Servicios':'Barberos'}</h1><p class="muted">Los elementos desactivados conservan el historial.</p><button onclick="editItem('${type}',0)">Nuevo ${service?'servicio':'barbero'}</button><div class="rows" style="margin-top:20px">${db[type].map(x=>`<article class="row"><span class="tag">${x.active?'Activo':'Inactivo'}</span><h2>${escape(x.name)}</h2><p>${service?`${x.duration} minutos · ${money(x.price)} · ${escape(x.desc)}`:escape(x.specialty)}</p><div class="actions"><button class="secondary" onclick="editItem('${type}',${x.id})">Editar</button><button class="secondary" onclick="toggleItem('${type}',${x.id})">${x.active?'Desactivar':'Activar'}</button></div></article>`).join('')}</div>`}
function toggleItem(type,id){if(role!=='admin')return;let x=db[type].find(a=>a.id===id);x.active=!x.active;save();render();toast('Estado actualizado. Las citas existentes se conservan.')}
function editItem(type,id){if(role!=='admin')return;let x=db[type].find(a=>a.id===id)||{},srv=type==='services';openModal(id?'Editar registro':'Nuevo registro',`<form onsubmit="saveItem(event,'${type}',${id})"><label>Nombre<input name="name" value="${escape(x.name||'')}" required></label>${srv?`<label>Descripción<input name="desc" value="${escape(x.desc||'')}" required></label><div class="grid"><label>Duración en minutos<input type="number" min="10" max="180" step="10" name="duration" value="${x.duration||30}" required></label><label>Precio en soles<input type="number" min="0" step="0.10" name="price" value="${x.price||25}" required></label></div>`:`<label>Especialidad<input name="specialty" value="${escape(x.specialty||'')}" required></label>`}<button>Guardar</button></form>`)}
function saveItem(e,type,id){e.preventDefault();if(role!=='admin')return;let x=Object.fromEntries(new FormData(e.target));if(type==='services'){x.duration=Number(x.duration);x.price=Number(x.price)}if(id)Object.assign(db[type].find(a=>a.id===id),x);else{x.id=Math.max(0,...db[type].map(a=>a.id))+1;x.active=true;db[type].push(x);if(type==='barbers')db.hours[x.id]={start:'09:00',end:'18:00',restStart:'13:00',restEnd:'14:00'}}save();closeModal();render();toast('Registro guardado.')}
function schedule(){if(role!=='admin')return;let b=window.scheduleBarber||db.barbers.find(x=>x.active)?.id||1,day=window.scheduleDay??4,h=db.weekHours?.[b]?.[day]||db.hours[b];$('#view').innerHTML=`<h1>Horarios y bloqueos</h1><label>Profesional<select onchange="window.scheduleBarber=Number(this.value);schedule()">${options(db.barbers,b)}</select></label><form class="card" onsubmit="saveHours(event,${b})"><h2>Jornada semanal</h2><label>Día de semana<select onchange="window.scheduleDay=Number(this.value);schedule()">${['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'].map((n,i)=>`<option value="${i}" ${i===day?'selected':''}>${n}</option>`).join('')}</select></label><div class="grid">${[['start','Inicio'],['end','Fin'],['restStart','Inicio del descanso'],['restEnd','Fin del descanso']].map(([k,l])=>`<label>${l}<input type="time" name="${k}" value="${h[k]}" required></label>`).join('')}</div><button>Guardar jornada</button></form><form class="card" onsubmit="addBlock(event,${b})"><h2>Nuevo bloqueo</h2><label>Fecha<input type="date" name="date" min="2026-09-28" value="2026-10-01" required></label><div class="grid"><label>Inicio<input type="time" name="start" value="16:00" required></label><label>Fin<input type="time" name="end" value="17:00" required></label></div><label>Motivo<input name="reason" required></label><button>Agregar bloqueo</button></form><div class="rows">${db.blocks.filter(k=>k.barber===b).map(k=>`<div class="row">${k.date} · ${k.start} a ${k.end} · ${escape(k.reason)} <button class="secondary" onclick="db.blocks=db.blocks.filter(k=>k.id!==${k.id});save();schedule()">Quitar</button></div>`).join('')}</div>`}
function saveHours(e,b){e.preventDefault();let h=Object.fromEntries(new FormData(e.target));if(!(mins(h.start)<mins(h.restStart)&&mins(h.restStart)<mins(h.restEnd)&&mins(h.restEnd)<mins(h.end)))return toast('Revisa el orden de jornada y descanso.',true);let conflict=db.reservations.some(r=>r.barber===b&&['pendiente','confirmada','en atención'].includes(r.state)&&new Date(r.date+'T12:00:00-05:00').getUTCDay()===(window.scheduleDay??4)&&(mins(r.time)<mins(h.start)||mins(r.time)+r.duration>mins(h.end)||(mins(r.time)<mins(h.restEnd)&&mins(r.time)+r.duration>mins(h.restStart))));if(conflict)return toast('La jornada dejaría una cita vigente fuera del horario. Reprograma primero.',true);db.weekHours=db.weekHours||{};db.weekHours[b]=db.weekHours[b]||{};db.weekHours[b][window.scheduleDay??4]=h;save();toast('Jornada del día seleccionado guardada.')}
function addBlock(e,b){e.preventDefault();let k=Object.fromEntries(new FormData(e.target));if(mins(k.start)>=mins(k.end))return toast('El fin debe ser posterior al inicio.',true);if(db.reservations.some(r=>r.barber===b&&r.date===k.date&&r.state!=='cancelada'&&mins(k.start)<mins(r.time)+r.duration&&mins(k.end)>mins(r.time)))return toast('El bloqueo cruza una reserva existente. No se guardó.',true);k.id=Date.now();k.barber=b;db.blocks.push(k);save();schedule();toast('Bloqueo registrado.')}
function reports(){if(role!=='admin')return;$('#view').innerHTML=`<h1>Reportes e historial operativo</h1><div class="card"><div class="grid"><label>Desde<input type="date" id="from" value="2026-09-01"></label><label>Hasta<input type="date" id="to" value="2026-10-31"></label><label>Servicio<select id="repService"><option value="">Todos</option>${db.services.map(s=>`<option value="${s.id}">${escape(s.name)}</option>`).join('')}</select></label><label>Profesional<select id="repBarber"><option value="">Todos</option>${db.barbers.map(s=>`<option value="${s.id}">${escape(s.name)}</option>`).join('')}</select></label></div><button onclick="reportRows()">Aplicar filtros</button></div><div id="reportRows"></div>`;reportRows()}
function reportRows(){if($('#from').value>$('#to').value)return toast('Rango de fechas inválido.',true);let rs=db.reservations.filter(r=>r.date>=$('#from').value&&r.date<=$('#to').value&&(!$('#repService').value||r.service==$('#repService').value)&&(!$('#repBarber').value||r.barber==$('#repBarber').value));let count=k=>rs.filter(r=>r.state===k).length;$('#reportRows').innerHTML=`<div class="stats"><div class="stat">Total<b>${rs.length}</b></div>${['pendiente','confirmada','en atención','completada','cancelada','no asistió'].map(k=>`<div class="stat">${k}<b>${count(k)}</b></div>`).join('')}</div><div class="card"><h2>Por servicio</h2>${db.services.map(s=>`<p>${escape(s.name)}: ${rs.filter(r=>r.service===s.id).length}</p>`).join('')}<h2>Por profesional</h2>${db.barbers.map(b=>`<p>${escape(b.name)}: ${rs.filter(r=>r.barber===b.id).length}</p>`).join('')}</div><div class="overflow"><table><thead><tr><th>Cita</th><th>Fecha</th><th>Servicio</th><th>Estado</th></tr></thead><tbody>${rs.map(r=>`<tr><td>BT-${r.id}</td><td>${r.date} ${r.time}</td><td>${escape(r.serviceName)}</td><td>${r.state}</td></tr>`).join('')}</tbody></table></div>`}
render();
</script></html>
