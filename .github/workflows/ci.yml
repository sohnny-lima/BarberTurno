name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # El evento separa push y pull_request para evitar que se cancelen entre sí.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ci_admin
          # Credencial efímera solo para la CI, sin relación con los secretos locales.
          POSTGRES_PASSWORD: barberturno_ci_efimera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Java 21 y la caché de Maven
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Preparar los roles y las bases aisladas de v2
        shell: bash
        env:
          PGPASSWORD: barberturno_ci_efimera
        run: |
          export BT_DB_PASSWORD=$(openssl rand -hex 32)
          export BT_FLYWAY_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$BT_DB_PASSWORD"
          echo "::add-mask::$BT_FLYWAY_PASSWORD"
          psql -X -q -v ON_ERROR_STOP=1 -h localhost -U ci_admin -d postgres <<'SQL'
          \getenv app_password BT_DB_PASSWORD
          \getenv flyway_password BT_FLYWAY_PASSWORD
          CREATE ROLE barberturno_v2 LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'flyway_password';
          CREATE ROLE barberturno_v2_app LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'app_password';
          CREATE DATABASE barberturno_v2 OWNER barberturno_v2;
          CREATE DATABASE barberturno_v2_test OWNER barberturno_v2;
          CREATE DATABASE barberturno_v2_migracion OWNER barberturno_v2;
          REVOKE ALL ON DATABASE barberturno_v2, barberturno_v2_test, barberturno_v2_migracion FROM PUBLIC;
          GRANT CONNECT ON DATABASE barberturno_v2, barberturno_v2_test, barberturno_v2_migracion TO barberturno_v2_app;
          SQL
          echo "BT_DB_USER=barberturno_v2_app" >> "$GITHUB_ENV"
          echo "BT_DB_PASSWORD=$BT_DB_PASSWORD" >> "$GITHUB_ENV"
          echo "BT_FLYWAY_USER=barberturno_v2" >> "$GITHUB_ENV"
          echo "BT_FLYWAY_PASSWORD=$BT_FLYWAY_PASSWORD" >> "$GITHUB_ENV"
      - name: Verificar el backend con PostgreSQL real
        # pipefail conserva el código de Maven aunque la salida pase por tee.
        shell: bash
        run: ./mvnw -B -ntp verify 2>&1 | tee maven-verify.log
        env:
          SPRING_PROFILES_ACTIVE: test
          BT_DB_URL: jdbc:postgresql://localhost:5432/barberturno_v2_test
      - name: Resumir los errores de Maven como anotaciones
        # Las anotaciones son públicas en la API; los logs exigen autenticación.
        if: failure()
        shell: bash
        run: |
          limpiar() { sed -e 's/%/%25/g' -e 's/\r//g'; }
          # Cada prueba fallida con la línea siguiente (mensaje de la aserción o excepción).
          awk '/<<< (FAILURE|ERROR)!/ { cab = $0; getline msg; print cab " :: " msg }' maven-verify.log \
            | head -n 8 | limpiar \
            | while IFS= read -r linea; do echo "::error title=Prueba fallida::${linea}"; done
          grep -E '^\[ERROR\]' maven-verify.log | grep -v -E '^\[ERROR\] *$|<<< (FAILURE|ERROR)!' | head -n 2 \
            | limpiar | while IFS= read -r linea; do echo "::error title=Maven verify::${linea}"; done
          # Orden real de ejecución de las clases (útil para reproducir dependencias de orden).
          orden=$(grep -oE 'in pe\.barberturno\.[A-Za-z0-9_.]+' maven-verify.log | sed 's/^in pe\.barberturno\.//' | paste -sd ',' -)
          echo "::notice title=Orden de clases::${orden}"
      - name: Publicar cobertura y resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reportes
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Node y la caché de npm
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar las dependencias del lock
        run: npm ci
      - name: Comprobar lint
        run: npm run lint
      - name: Comprobar el formato
        run: npm run format:check
      - name: Ejecutar las pruebas
        run: npm test -- --watch=false
      - name: Compilar para producción
        run: npm run build
