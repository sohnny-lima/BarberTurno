spring:
  application:
    name: barberturno
  datasource:
    hikari:
      connection-init-sql: SET lock_timeout = '5s'
  flyway:
    user: ${BT_FLYWAY_USER:barberturno_v2}
    password: ${BT_FLYWAY_PASSWORD}
    placeholders:
      rolAplicacion: ${BT_DB_USER:barberturno_v2_app}
      negocioUnicoSlug: barberturno
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: false
      show-details: never
      show-components: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

barberturno:
  reservas:
    anticipacion-cambio-cliente: 2h
    horizonte-dias: 30
    rejilla-min: 10
    max-activas-por-cliente: 3
    confirmacion-manual: false
    tolerancia-inicio-min: 15
  # V2-08: secretos solo por el entorno; vacíos, el webhook falla cerrado (V2-DA-55).
  whatsapp:
    verify-token: ${BT_WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${BT_WHATSAPP_APP_SECRET:}
    procesador:
      habilitado: true
      intervalo: 1500ms
      lote: 20
      max-intentos: 5
      espera-base: 5s
      espera-maxima: 5m
      reclamo: 60s

# El advice registra errores sanitizados; Hibernate no debe imprimir valores
# personales de claves duplicadas devueltos por PostgreSQL.
logging:
  level:
    org.hibernate.orm.jdbc.error: OFF
