spring:
  application:
    name: barberturno
  datasource:
    hikari:
      connection-init-sql: SET lock_timeout = '5s'
  flyway:
    user: ${BT_FLYWAY_USER:barberturno_v2}
    password: ${BT_FLYWAY_PASSWORD}
    placeholders:
      rolAplicacion: ${BT_DB_USER:barberturno_v2_app}
      negocioUnicoSlug: barberturno
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # V2-09: dos hilos para que el envío por la Graph API no retrase el procesador de entrada (V2-DA-57).
  task:
    scheduling:
      pool:
        size: 2

server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: false
      show-details: never
      show-components: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

barberturno:
  # V2-18 (V2-DA-95): asociación con la app Android (TWA); vacía = /.well-known/assetlinks.json responde 404.
  android:
    paquete: ${BT_TWA_PAQUETE:}
    huellas: ${BT_TWA_HUELLAS:}
  reservas:
    anticipacion-cambio-cliente: 2h
    horizonte-dias: 30
    rejilla-min: 10
    max-activas-por-cliente: 3
    confirmacion-manual: false
    tolerancia-inicio-min: 15
  # V2-08: secretos solo por el entorno; vacíos, el webhook falla cerrado (V2-DA-55).
  whatsapp:
    verify-token: ${BT_WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${BT_WHATSAPP_APP_SECRET:}
    procesador:
      habilitado: true
      intervalo: 1500ms
      lote: 20
      max-intentos: 5
      espera-base: 5s
      espera-maxima: 5m
      reclamo: 60s
    # V2-09: salida por la Graph API oficial (12-v2-09-whatsapp-salida.md §4.7); sin token no se envía.
    salida:
      habilitado: true
      intervalo: 2s
      lote: 20
      max-intentos: 5
      espera-base: 30s
      espera-maxima: 5m
      espera-conciliacion: 2m
      reclamo: 60s
      antiguedad-maxima: 6h
      margen-ventana: 5m
      graph:
        url-base: https://graph.facebook.com
        version: v26.0
        token: ${BT_WHATSAPP_ACCESS_TOKEN:}
        conexion: 5s
        respuesta: 15s
  # V2-12 (17-v2-12 §6): sin clave la IA queda desactivada y se usan los menús. La clave la escribe el responsable (P2-03).
  ia:
    habilitada: true
    clave: ${BT_IA_API_KEY:}
    modelo: claude-opus-5-5
    esfuerzo: low
    # Precios en USD por millón de tokens: tabla de modelos de Anthropic (consultada el 04/11/2026; 09-costes.md §3).
    # Escritura de caché de 5 min = 1,25 × entrada. Se vuelven a comprobar al resolver P2-03.
    precios:
      claude-haiku-5-5: { entrada: 0.10, salida: 0.50, cache-lectura: 0.01, cache-escritura: 0.125 }
      claude-sonnet-5-5: { entrada: 2.00, salida: 10.00, cache-lectura: 0.20, cache-escritura: 2.50 }
      claude-opus-5-5: { entrada: 4.00, salida: 20.00, cache-lectura: 0.20, cache-escritura: 5.00 }

# El advice registra errores sanitizados; Hibernate no debe imprimir valores
# personales de claves duplicadas devueltos por PostgreSQL.
logging:
  level:
    org.hibernate.orm.jdbc.error: OFF
