spring:
  config:
    import: optional:file:../.local/barberturno.env[.properties]
  datasource:
    url: ${BT_DB_URL:jdbc:postgresql://localhost:5433/barberturno}
    username: ${BT_DB_USER:barberturno}
    password: ${BT_DB_PASSWORD}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    pe.barberturno: DEBUG

barberturno:
  seguridad:
    cookie-secure: ${BT_COOKIE_SECURE:false}
